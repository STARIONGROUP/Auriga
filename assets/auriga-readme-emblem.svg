    <circle cx="397" cy="126" r="16" fill="#E5A510" stroke="none"/>
  </g>
  <g fill="#082B55" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="510" y="185" font-size="138" font-weight="600" letter-spacing="2">Auriga</text>
    <text x="518" y="235" font-size="28" font-weight="500" letter-spacing="4" fill="#52708E">CAPELLA MODELS FOR .NET</text>
  </g>
  <path d="M1030 58 1037 84 1063 91 1037 98 1030 124 1023 98 997 91 1023 84Z" fill="#E5A510"/>
</svg>
