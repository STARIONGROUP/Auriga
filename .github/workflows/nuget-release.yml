name: Nuget-Release

# Manual, versioned release of the Auriga NuGet packages (Auriga, Auriga.Xmi, Auriga.Extensions,
# Auriga.Rendering). Auriga.CodeGenerator and Auriga.Reporting are IsPackable=false, so `dotnet pack`
# on the solution produces exactly the library packages (plus their .snupkg symbol packages).
# Packaging metadata, SBOM generation (Microsoft.Sbom.Targets) and SourceLink are configured in
# Directory.Build.props.
#
# CHANGELOG.md is the source of truth for what a release contains. This workflow moves its
# [Unreleased] section under the version being released, writes each package's entries into that
# package's <PackageReleaseNotes> — which is generated, never hand-edited — and builds the GitHub
# release body from the same section. Run it with dry_run to see what a release would say without
# committing, packing or publishing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer (e.g., 1.0.0 or 1.0.0-beta.1)'
        required: true
        type: string
      dry_run:
        description: 'Render the release notes and stop: no commit, no pack, no publish, no tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # A release is always cut from the default branch. A dry run takes the ref it was
          # dispatched from, so a change to the release machinery can be rehearsed on its branch.
          ref: ${{ inputs.dry_run && github.ref_name || github.event.repository.default_branch }}

      - name: Validate version (SemVer)
        id: semver
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.version }}"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z\.-]+)?$ ]]; then
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
            if [[ "$VERSION" == *-* ]]; then
              echo "PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "Provided version '$VERSION' is not SemVer." >&2
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Set date
        run: |
          DATE=$(date +'%Y-%m-%d')
          echo "DATE=$DATE" >> $GITHUB_ENV

      - name: Install xmlstarlet (for editing csproj)
        run: |
          sudo apt-get update
          sudo apt-get install -y xmlstarlet

      - name: Update CITATION.cff (version + date)
        run: |
          set -euo pipefail
          # Top-level
          sed -i "s/^version:.*/version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^date-released:.*/date-released: \"${DATE}\"/" CITATION.cff
          # preferred-citation (two-space indent)
          sed -i "s/^  version:.*/  version: \"${VERSION}\"/" CITATION.cff
          sed -i "s/^  date-released:.*/  date-released: \"${DATE}\"/" CITATION.cff

      - name: Roll CHANGELOG.md and sync csproj release notes
        run: |
          set -euo pipefail

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found: it is the source of a release's notes." >&2
            exit 1
          fi

          # The body of '## [Unreleased]', up to the next '## ' heading.
          awk '
            /^## \[Unreleased\]/ { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > unreleased.md

          if ! grep -q '^### ' unreleased.md; then
            echo "CHANGELOG.md carries no package entries under [Unreleased]; there is nothing to release." >&2
            exit 1
          fi

          echo "The following items have been fixed in this release:" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          mapfile -t CSPROJS < <(git ls-files '*.csproj' | sort)

          for csproj in "${CSPROJS[@]}"; do
            # Only the packable projects carry the generated element.
            has_notes="$(xmlstarlet sel -t -v 'count(//Project/PropertyGroup/PackageReleaseNotes)' "$csproj" 2>/dev/null || echo 0)"
            if [ "$has_notes" = "0" ]; then
              continue
            fi

            # PackageId (fallback to file name)
            pkg_id="$(xmlstarlet sel -t -v '(//Project/PropertyGroup/PackageId)[1]' "$csproj" 2>/dev/null || true)"
            if [ -z "$pkg_id" ]; then
              pkg_id="$(basename "$csproj" .csproj)"
            fi

            # Version (fallback to the workflow input)
            pkg_version="$(xmlstarlet sel -t -v '(//Project/PropertyGroup/Version)[1]' "$csproj" 2>/dev/null || true)"
            if [ -z "$pkg_version" ]; then
              pkg_version="${VERSION}"
            fi

            # This package's bullets, from its '### <PackageId>' subsection.
            notes="$(awk -v heading="### ${pkg_id}" '
              $0 == heading { inside = 1; next }
              inside && /^#/ { exit }
              inside && /^- / { sub(/^- /, ""); print }
            ' unreleased.md)"

            # A package with no entries this release must not ship the previous release's notes,
            # so the element is written either way — empty when the package did not change.
            xmlstarlet ed -L -u '(//Project/PropertyGroup/PackageReleaseNotes)[1]' -v "$notes" "$csproj"

            if [ -n "$notes" ]; then
              printf "**%s [%s]**\n" "$pkg_id" "$pkg_version" >> RELEASE_NOTES.md
              while IFS= read -r line; do
                printf "  - %s\n" "$line" >> RELEASE_NOTES.md
              done <<< "$notes"
              echo "" >> RELEASE_NOTES.md
            fi
          done

          # Move [Unreleased] under the version being released and open a fresh one.
          awk -v version="${VERSION}" -v date="${DATE}" '
            /^## \[Unreleased\]/ && !rolled {
              print "## [Unreleased]";
              print "";
              print "## [" version "] - " date;
              rolled = 1;
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.rolled && mv CHANGELOG.rolled CHANGELOG.md

          rm -f unreleased.md

          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md
          echo "----- csproj release notes -----"
          for csproj in "${CSPROJS[@]}"; do
            xmlstarlet sel -t -v 'concat((//Project/PropertyGroup/PackageId)[1], ": ")' -v 'count(//Project/PropertyGroup/PackageReleaseNotes/text())' -n "$csproj" 2>/dev/null || true
          done

      - name: Upload the rendered release (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.event.inputs.version }}-dry-run
          path: |
            RELEASE_NOTES.md
            CHANGELOG.md
            **/*.csproj
            CITATION.cff

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: nothing was committed, packed, published or tagged." >> "$GITHUB_STEP_SUMMARY"
          echo "The rendered release notes and the edited files are attached as an artifact." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the release metadata to the default branch
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CITATION.cff CHANGELOG.md '*.csproj'

          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${VERSION} (CITATION.cff, CHANGELOG.md, package release notes)"
            git push origin HEAD:${DEFAULT_BRANCH}
          else
            echo "No release metadata changed."
          fi

      - name: Pack
        if: ${{ !inputs.dry_run }}
        run: dotnet pack -c Release -o ReleaseBuilds Auriga.sln

      - name: Push to NuGet
        if: ${{ !inputs.dry_run }}
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push ReleaseBuilds/*.nupkg -k "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create annotated tag at this commit
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create draft GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FLAGS=(--draft --title "Auriga ${VERSION}" --notes-file RELEASE_NOTES.md --target "${DEFAULT_BRANCH}")
          if [ "${PRERELEASE}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "${VERSION}" "${FLAGS[@]}"
